<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo.png" />
  <title>Syntax Alpha - Portafolio Académico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  
  <!-- Imagen de fondo tecnológica con opacidad -->
  <div className="fixed inset-0 bg-[url('fondo.png')] bg-cover bg-center opacity-20 pointer-events-none z-0"></div>

  <div id="root" className="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.location.origin.includes("http") ? window.location.origin : "http://localhost:8000";

    // Diccionario de dependencias (Materias previas y siguientes) basado en la retícula ITIC-2010-225
    const RETICULA_DEPENDENCIAS = {
      "ACF-2301": { previas: [], siguientes: ["ACF-0902", "TIE-1018"] }, // Cálculo Diferencial
      "AEF-1032": { previas: [], siguientes: ["AEB-1054", "TID-1012"] }, // Fundamentos de Programación
      "TIF-1019": { previas: [], siguientes: ["TIF-1020"] }, // Mat. Discretas I
      "TIP-1017": { previas: [], siguientes: ["TIF-1013"] }, // Intro TICs
      "ACF-0902": { previas: ["ACF-2301"], siguientes: ["TIF-1021"] }, // Cálculo Integral
      "AEB-1054": { previas: ["AEF-1032"], siguientes: ["AEF-1031"] }, // POO
      "TIF-1020": { previas: ["TIF-1019"], siguientes: ["TIF-1018"] }, // Mat. Discretas II
      "ACF-0903": { previas: [], siguientes: ["TIE-1018"] }, // Álgebra Lineal
      "TIF-1009": { previas: [], siguientes: ["TIF-1021"] }, // Contabilidad y Costos
      "AEF-1052": { previas: [], siguientes: ["TIF-1021"] }, // Probabilidad
      "TIE-1018": { previas: ["ACF-2301", "ACF-0903"], siguientes: ["TID-1004"] }, // Mat. Aplicadas
      "TID-1012": { previas: ["AEF-1032"], siguientes: ["AEF-1031"] }, // Estructuras de Datos
      "TIF-1021": { previas: ["ACF-0902", "TIF-1009", "AEF-1052"], siguientes: [] }, // Toma de Decisiones
      "TIC-1011": { previas: [], siguientes: ["TIF-1013"] }, // Electricidad
      "TIF-1013": { previas: ["TIP-1017", "TIC-1011"], siguientes: ["TIC-1002"] }, // Fundamentos de Redes
      "AEF-1031": { previas: ["AEB-1054", "TID-1012"], siguientes: ["TIF-1004"] }, // Base de Datos
      // NOTA: Para no hacer el código infinitamente largo, he mapeado las principales. 
      // Si una materia no está aquí, el sistema mostrará "Sin dependencias registradas".
    };

    function PortafolioITPApp() {
      const [usuarioActivo, setUsuarioActivo] = useState(() => {
        try {
          const guardado = localStorage.getItem("itp_usuario_sesion");
          return guardado ? JSON.parse(guardado) : null;
        } catch { return null; }
      });

      const [vistaActual, setVistaActual] = useState(usuarioActivo ? "portafolio" : "inicio");
      const [materias, setMaterias] = useState([]);

      // Flujos de Autenticación
      const [modoAuth, setModoAuth] = useState("registro");
      const [nombreReg, setNombreReg] = useState("");
      const [matriculaReg, setMatriculaReg] = useState("");
      const [correoReg, setCorreoReg] = useState("");
      const [passwordReg, setPasswordReg] = useState("");
      const [confirmarPasswordReg, setConfirmarPasswordReg] = useState("");
      const [modoSemestreReg, setModoSemestreReg] = useState("AUTOMATICO");
      const [semestreManualReg, setSemestreManualReg] = useState(1);
      const [fechaInicioReg, setFechaInicioReg] = useState("");
      const [fechaFinReg, setFechaFinReg] = useState("");
      const [fotoReg, setFotoReg] = useState(null);

      const [estadoCorreoMX, setEstadoCorreoMX] = useState(null);
      const [validandoMX, setValidandoMX] = useState(false);

      const [correoEnProceso, setCorreoEnProceso] = useState("");
      const [digitosOTP, setDigitosOTP] = useState(["", "", "", "", "", ""]);
      const [errorAuth, setErrorAuth] = useState(null);
      const [procesandoAuth, setProcesandoAuth] = useState(false);
      const inputsRef = useRef([]);

      // Estados de Subida de Evidencias e IA
      const [materiaSeleccionada, setMateriaSeleccionada] = useState("");
      const [titulo, setTitulo] = useState("");
      const [descripcion, setDescripcion] = useState("");
      const [urlExterna, setUrlExterna] = useState("");
      const [colaArchivos, setColaArchivos] = useState([]);
      const [subiendo, setSubiendo] = useState(false);
      const [alerta, setAlerta] = useState(null);

      // Estados de Portafolio / CV
      const [datosPortafolio, setDatosPortafolio] = useState(null);
      const [semestreActivoHistorial, setSemestreActivoHistorial] = useState("TODOS");
      const [archivoEnVisor, setArchivoEnVisor] = useState(null);
      const [textoCodigoVisor, setTextoCodigoVisor] = useState("");
      
      // Estado para el modal de la retícula
      const [materiaModal, setMateriaModal] = useState(null);

      const cargarDatosUsuario = async (userObj = usuarioActivo) => {
        try {
          const idParam = userObj ? `?estudiante_id=${userObj.id}` : "";
          const rMat = await fetch(`${API_BASE}/api/reticula/materias${idParam}`);
          if (rMat.ok) {
            const dataMat = await rMat.json();
            if (Array.isArray(dataMat)) {
              setMaterias(dataMat);
              if (dataMat.length > 0 && !materiaSeleccionada) setMateriaSeleccionada(dataMat[0].id);
            }
          }
          if (userObj) {
            const rPort = await fetch(`${API_BASE}/api/portafolio/${userObj.id}`);
            if (rPort.ok) setDatosPortafolio(await rPort.json());
          }
        } catch (err) {
          console.error(err);
        }
      };

      useEffect(() => { cargarDatosUsuario(); }, [usuarioActivo]);

      const verificarCorreoConGoogleDNS = async (emailValor) => {
        // ... (Misma lógica de validación)
        const limpio = (emailValor || "").trim().toLowerCase();
        if (!limpio) { setEstadoCorreoMX(null); return false; }
        const regexEmail = /^[a-zA-Z0-9][a-zA-Z0-9_.+-]{1,62}@[a-zA-Z0-9-]+\.[a-zA-Z]{2,}$/;
        if (!regexEmail.test(limpio)) { setEstadoCorreoMX({ valido: false, texto: "Ingresa un formato de correo electrónico válido." }); return false; }
        setValidandoMX(true);
        try {
          const [userPart, dominio] = limpio.split("@");
          const resp = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(dominio)}&type=MX`);
          const data = await resp.json();
          if (data.Status === 0 && Array.isArray(data.Answer) && data.Answer.length > 0) {
            setEstadoCorreoMX({ valido: true, texto: `Correo válido verificado (${dominio}).` });
            return true;
          } else {
            setEstadoCorreoMX({ valido: false, texto: `El dominio @${dominio} no existe.` });
            return false;
          }
        } catch {
          setEstadoCorreoMX({ valido: true, texto: "Formato válido." });
          return true;
        } finally { setValidandoMX(false); }
      };

      const cambiarDigitoOTP = (index, valor) => {
        const soloNumero = valor.replace(/[^0-9]/g, "").slice(-1);
        const nuevos = [...digitosOTP];
        nuevos[index] = soloNumero;
        setDigitosOTP(nuevos);
        if (soloNumero && index < 5 && inputsRef.current[index + 1]) inputsRef.current[index + 1].focus();
      };

      const pegarCodigoCompleto = (e) => {
        const pegado = e.clipboardData.getData("text").replace(/[^0-9]/g, "").slice(0, 6);
        if (pegado.length > 0) {
          const nuevos = ["", "", "", "", "", ""];
          for (let i = 0; i < pegado.length; i++) nuevos[i] = pegado[i];
          setDigitosOTP(nuevos);
        }
      };

      const manejarRegistro = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        const esCorreoValido = await verificarCorreoConGoogleDNS(correoReg);
        if (!esCorreoValido) { setErrorAuth({ tipo: "error", msg: "Ingresa un correo válido." }); return; }
        setProcesandoAuth(true);
        const fd = new FormData();
        fd.append("nombre_completo", nombreReg);
        fd.append("matricula", matriculaReg);
        fd.append("correo", correoReg.trim().toLowerCase());
        fd.append("password", passwordReg);
        if (fotoReg) fd.append("foto", fotoReg);

        try {
          const res = await fetch(`${API_BASE}/api/auth/registro`, { method: "POST", body: fd });
          const data = await res.json();
          if (res.ok && data.requiere_verificacion) {
            setCorreoEnProceso(data.correo);
            setDigitosOTP(["", "", "", "", "", ""]);
            setErrorAuth({ tipo: "ok", msg: `Código enviado a ${data.correo}.` });
            setModoAuth("verificar_correo");
          } else {
            setErrorAuth({ tipo: "error", msg: data.detail || "Error al registrar." });
          }
        } catch { setErrorAuth({ tipo: "error", msg: "Error de conexión." }); } 
        finally { setProcesandoAuth(false); }
      };

      const manejarVerificarCorreo = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        const codigoUnido = digitosOTP.join("");
        if (codigoUnido.length !== 6) { setErrorAuth({ tipo: "error", msg: "Ingresa los 6 dígitos." }); return; }
        setProcesandoAuth(true);
        const fd = new FormData();
        fd.append("correo", correoEnProceso);
        fd.append("codigo", codigoUnido);
        try {
          const res = await fetch(`${API_BASE}/api/auth/verificar-correo`, { method: "POST", body: fd });
          const data = await res.json();
          if (res.ok && data.usuario) {
            localStorage.setItem("itp_usuario_sesion", JSON.stringify(data.usuario));
            setUsuarioActivo(data.usuario);
            await cargarDatosUsuario(data.usuario);
            setVistaActual("portafolio");
          } else { setErrorAuth({ tipo: "error", msg: data.detail || "Código incorrecto." }); }
        } catch { setErrorAuth({ tipo: "error", msg: "Error." }); } 
        finally { setProcesandoAuth(false); }
      };

      const manejarLogin = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        setProcesandoAuth(true);
        const fd = new FormData();
        fd.append("identificador", matriculaReg);
        fd.append("password", passwordReg);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, { method: "POST", body: fd });
          const data = await res.json();
          if (res.ok && data.usuario) {
            localStorage.setItem("itp_usuario_sesion", JSON.stringify(data.usuario));
            setUsuarioActivo(data.usuario);
            await cargarDatosUsuario(data.usuario);
            setVistaActual("portafolio");
          } else { setErrorAuth({ tipo: "error", msg: data.detail || "Credenciales incorrectas." }); }
        } catch { setErrorAuth({ tipo: "error", msg: "Error." }); } 
        finally { setProcesandoAuth(false); }
      };

      const cerrarSesion = () => {
        localStorage.removeItem("itp_usuario_sesion");
        setUsuarioActivo(null);
        setDatosPortafolio(null);
        setVistaActual("inicio");
      };

      const guardarEvidenciaConIA = async (e) => {
        e.preventDefault();
        if (!usuarioActivo) return;
        setSubiendo(true);
        setAlerta(null);
        const fd = new FormData();
        fd.append("estudiante_id", usuarioActivo.id);
        fd.append("titulo", titulo);
        fd.append("descripcion", descripcion);
        fd.append("materia_id", materiaSeleccionada);
        if (urlExterna.trim()) fd.append("url_enlace_externo", urlExterna.trim());
        colaArchivos.forEach((f) => fd.append("archivos", f));

        try {
          const res = await fetch(`${API_BASE}/api/evidencias/subir`, { method: "POST", body: fd });
          const data = await res.json();
          if (res.ok) {
            setAlerta({ tipo: "ok", msg: data.mensaje, detalleIA: data.analisis_ia });
            setTitulo(""); setDescripcion(""); setUrlExterna(""); setColaArchivos([]);
            await cargarDatosUsuario();
          } else { setAlerta({ tipo: "error", msg: data.detail || "Error al subir." }); }
        } catch { setAlerta({ tipo: "error", msg: "Error de conexión." }); } 
        setSubiendo(false);
      };

      const previsualizarArchivo = async (arch) => {
        setArchivoEnVisor(arch);
        setTextoCodigoVisor("");
        const n = (arch.nombre || "").toLowerCase();
        if (arch.tipo === "CODIGO" || n.endsWith(".txt") || n.endsWith(".py") || n.endsWith(".sql")) {
          const res = await fetch(`${API_BASE}/api/archivos/leer-texto/${arch.id}`);
          if (res.ok) setTextoCodigoVisor(await res.text());
        }
      };

      const construirHistorialPorSemestre = () => {
        const mapaEvidenciasPorMateria = {};
        if (datosPortafolio && Array.isArray(datosPortafolio.portafolio_por_materia)) {
          datosPortafolio.portafolio_por_materia.forEach((bloque) => {
            if (bloque && bloque.clave) mapaEvidenciasPorMateria[bloque.clave] = bloque.evidencias || [];
          });
        }
        return [1, 2, 3, 4, 5, 6, 7, 8, 9].map((numSem) => {
          const materiasDelSemestre = (materias || []).filter((m) => m.semestre === numSem);
          const materiasConHistorial = materiasDelSemestre.map((m) => ({
            ...m, evidencias: mapaEvidenciasPorMateria[m.clave] || [],
          }));
          const totalEvidenciasSemestre = materiasConHistorial.reduce((acc, m) => acc + (m.evidencias?.length || 0), 0);
          return { semestre: numSem, materias: materiasConHistorial, totalEvidenciasSemestre };
        }).filter((s) => semestreActivoHistorial === "TODOS" || s.semestre === Number(semestreActivoHistorial));
      };

      // Función para obtener los nombres de las materias previas/siguientes por su clave
      const obtenerNombreMateria = (clave) => {
        const m = materias.find(mat => mat.clave === clave);
        return m ? m.nombre : clave;
      };

      return (
        <div className="min-h-screen text-slate-100 font-sans relative z-10">
          {/* BARRA DE NAVEGACIÓN CON LOGO */}
          <nav className="border-b border-white/10 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 print:hidden">
            <div className="max-w-7xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setVistaActual("inicio")}>
                <img src="logo.png" alt="Syntax Alpha" className="w-12 h-12 object-contain drop-shadow-lg" />
                <div>
                  <span className="font-extrabold text-white text-xl block leading-none tracking-wide">Syntax Alpha</span>
                  <span className="text-[11px] text-blue-400 font-bold tracking-widest uppercase">Portafolio ITICs • ITP</span>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button onClick={() => setVistaActual("inicio")} className={`px-4 py-2 text-xs font-bold rounded-lg transition-all ${vistaActual === "inicio" ? "bg-blue-600 text-white shadow-lg shadow-blue-500/50" : "bg-slate-800/80 hover:bg-slate-700"}`}>Inicio</button>
                <button onClick={() => setVistaActual("reticula")} className={`px-4 py-2 text-xs font-bold rounded-lg transition-all ${vistaActual === "reticula" ? "bg-blue-600 text-white shadow-lg shadow-blue-500/50" : "bg-slate-800/80 hover:bg-slate-700"}`}>Retícula</button>
                {usuarioActivo ? (
                  <>
                    <button onClick={() => setVistaActual("subir")} className={`px-4 py-2 text-xs font-bold rounded-lg transition-all ${vistaActual === "subir" ? "bg-blue-600 text-white shadow-lg shadow-blue-500/50" : "bg-slate-800/80 hover:bg-slate-700"}`}>+ Evidencia</button>
                    <button onClick={() => { cargarDatosUsuario(); setVistaActual("portafolio"); }} className={`px-4 py-2 text-xs font-bold rounded-lg transition-all ${vistaActual === "portafolio" ? "bg-emerald-500 text-white shadow-lg shadow-emerald-500/50" : "bg-emerald-700/80 hover:bg-emerald-600 text-white"}`}>Mi CV</button>
                    <button onClick={cerrarSesion} className="px-4 py-2 text-xs font-bold rounded-lg bg-red-950/80 text-red-300 border border-red-800/50 hover:bg-red-900 transition-all">Salir</button>
                  </>
                ) : (
                  <>
                    <button onClick={() => { setModoAuth("login"); setErrorAuth(null); setVistaActual("auth"); }} className="px-4 py-2 text-xs font-bold rounded-lg bg-slate-800/80 hover:bg-slate-700 transition-all">Iniciar Sesión</button>
                    <button onClick={() => { setModoAuth("registro"); setErrorAuth(null); setVistaActual("auth"); }} className="px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-500/50 transition-all">Crear Cuenta</button>
                  </>
                )}
              </div>
            </div>
          </nav>

          {/* 1. PÁGINA DE INICIO */}
          {vistaActual === "inicio" && (
            <main className="max-w-6xl mx-auto px-6 py-20 text-center relative">
              <div className="absolute top-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-600/20 blur-[100px] rounded-full pointer-events-none"></div>
              <span className="px-4 py-1.5 rounded-full text-xs font-bold bg-blue-950/80 text-blue-300 border border-blue-800/50 shadow-lg backdrop-blur-sm">
                Instituto Tecnológico de Puebla • Ingeniería en TICs
              </span>
              <h1 className="text-5xl md:text-7xl font-extrabold mt-8 text-white leading-tight drop-shadow-2xl">
                Tu Portafolio Académico <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Impulsado por IA</span>
              </h1>
              <p className="mt-8 text-lg text-slate-300 max-w-2xl mx-auto leading-relaxed">
                Bienvenido a <strong>Syntax Alpha</strong>. Registra tus proyectos, deja que nuestra Inteligencia Artificial analice tu código y genera automáticamente un Currículum Técnico verificable.
              </p>
              <div className="mt-12 flex justify-center gap-4">
                {!usuarioActivo ? (
                  <>
                    <button onClick={() => { setModoAuth("registro"); setErrorAuth(null); setVistaActual("auth"); }} className="px-8 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 font-extrabold text-white shadow-xl shadow-blue-600/30 transition-all transform hover:scale-105">Comenzar Ahora</button>
                    <button onClick={() => { setModoAuth("login"); setErrorAuth(null); setVistaActual("auth"); }} className="px-8 py-4 rounded-xl bg-slate-800/80 hover:bg-slate-700 font-bold text-slate-200 border border-slate-700 backdrop-blur-sm transition-all">Iniciar Sesión</button>
                  </>
                ) : (
                  <button onClick={() => setVistaActual("portafolio")} className="px-8 py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-extrabold text-white shadow-xl shadow-emerald-600/30 transition-all transform hover:scale-105">Ir a Mi Portafolio →</button>
                )}
              </div>
            </main>
          )}

          {/* 2. MÓDULO DE CUENTA Y VERIFICACIÓN EN DOS PASOS */}
          {vistaActual === "auth" && (
            <section className="max-w-xl mx-auto px-6 py-12">
              <div className="p-8 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-slate-800 shadow-2xl">
                
                {(modoAuth === "registro" || modoAuth === "login") && (
                  <div className="flex gap-2 mb-6 p-1 bg-slate-950/80 rounded-xl border border-slate-800">
                    <button onClick={() => { setModoAuth("registro"); setErrorAuth(null); }} className={`flex-1 py-2.5 rounded-lg text-xs font-extrabold transition ${modoAuth === "registro" ? "bg-blue-600 text-white shadow-md" : "text-slate-400"}`}>Crear Cuenta</button>
                    <button onClick={() => { setModoAuth("login"); setErrorAuth(null); }} className={`flex-1 py-2.5 rounded-lg text-xs font-extrabold transition ${modoAuth === "login" ? "bg-blue-600 text-white shadow-md" : "text-slate-400"}`}>Iniciar Sesión</button>
                  </div>
                )}

                {errorAuth && (
                  <div className={`mb-5 p-4 rounded-xl border text-xs font-semibold leading-relaxed ${
                    errorAuth.tipo === "ok" ? "bg-emerald-950/70 border-emerald-500 text-emerald-200" :
                    errorAuth.tipo === "info" ? "bg-blue-950/70 border-blue-500 text-blue-200" :
                    "bg-red-950/70 border-red-500 text-red-200"
                  }`}>
                    {errorAuth.msg}
                  </div>
                )}

                {/* REGISTRO */}
                {modoAuth === "registro" && (
                  <form onSubmit={manejarRegistro} className="space-y-4">
                    <div>
                      <h2 className="text-2xl font-extrabold text-white">Crear Cuenta</h2>
                      <p className="text-xs text-slate-400 mt-1">Únete a Syntax Alpha y verifica tu correo.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div><label className="block text-xs font-bold text-blue-400 mb-1">Nombre *</label><input required type="text" value={nombreReg} onChange={e => setNombreReg(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white focus:border-blue-500 focus:outline-none" /></div>
                      <div><label className="block text-xs font-bold text-blue-400 mb-1">Matrícula *</label><input required type="text" value={matriculaReg} onChange={e => setMatriculaReg(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white font-mono focus:border-blue-500 focus:outline-none" /></div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-emerald-400 mb-1">Correo Personal *</label>
                      <input required type="email" value={correoReg} onChange={e => { setCorreoReg(e.target.value); setEstadoCorreoMX(null); }} onBlur={e => verificarCorreoConGoogleDNS(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white font-mono focus:border-emerald-500 focus:outline-none" />
                      {estadoCorreoMX && <p className={`text-[11px] mt-1.5 font-semibold ${estadoCorreoMX.valido ? "text-emerald-400" : "text-red-400"}`}>{estadoCorreoMX.valido ? "✓ " : "✕ "}{estadoCorreoMX.texto}</p>}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div><label className="block text-xs font-bold text-blue-400 mb-1">Contraseña *</label><input required type="password" value={passwordReg} onChange={e => setPasswordReg(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white focus:border-blue-500 focus:outline-none" /></div>
                      <div><label className="block text-xs font-bold text-slate-400 mb-1">Foto (Opcional)</label><input type="file" accept="image/*" onChange={e => setFotoReg(e.target.files[0])} className="w-full text-xs text-slate-300 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-white cursor-pointer" /></div>
                    </div>
                    <button type="submit" disabled={procesandoAuth} className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 font-extrabold text-white text-sm shadow-lg transition-all mt-4">Crear Cuenta y Verificar</button>
                  </form>
                )}

                {/* VERIFICAR CORREO */}
                {modoAuth === "verificar_correo" && (
                  <form onSubmit={manejarVerificarCorreo} className="space-y-6">
                    <div className="text-center">
                      <h2 className="text-2xl font-extrabold text-white">Verifica tu correo</h2>
                      <p className="text-xs text-slate-300 mt-2">Enviamos un código a <span className="font-mono text-blue-400 font-bold">{correoEnProceso}</span></p>
                    </div>
                    <div className="flex justify-center gap-2.5" onPaste={pegarCodigoCompleto}>
                      {digitosOTP.map((dig, idx) => (
                        <input key={idx} ref={el => inputsRef.current[idx] = el} type="text" inputMode="numeric" maxLength="1" value={dig} onChange={e => cambiarDigitoOTP(idx, e.target.value)} className="w-12 h-14 rounded-xl bg-slate-950/50 border-2 border-slate-700 focus:border-blue-500 text-center text-2xl font-mono font-extrabold text-white outline-none" />
                      ))}
                    </div>
                    <button type="submit" disabled={procesandoAuth} className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 font-extrabold text-white text-sm shadow-lg">Verificar Cuenta</button>
                  </form>
                )}

                {/* LOGIN */}
                {modoAuth === "login" && (
                  <form onSubmit={manejarLogin} className="space-y-4">
                    <div>
                      <h2 className="text-2xl font-extrabold text-white">Iniciar Sesión</h2>
                    </div>
                    <div><label className="block text-xs font-bold text-blue-400 mb-1">Correo o Matrícula *</label><input required type="text" value={matriculaReg} onChange={e => setMatriculaReg(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white focus:border-blue-500 focus:outline-none" /></div>
                    <div><label className="block text-xs font-bold text-blue-400 mb-1">Contraseña *</label><input required type="password" value={passwordReg} onChange={e => setPasswordReg(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white focus:border-blue-500 focus:outline-none" /></div>
                    <button type="submit" disabled={procesandoAuth} className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 font-extrabold text-white text-sm shadow-lg mt-2">Entrar</button>
                  </form>
                )}
              </div>
            </section>
          )}

          {/* 3. RETÍCULA ESTILO DIAGRAMA */}
          {vistaActual === "reticula" && (
            <section className="max-w-[1600px] mx-auto px-4 py-8">
              <div className="mb-6 bg-slate-900/80 backdrop-blur-md p-5 rounded-xl border border-slate-700 shadow-xl flex justify-between items-center">
                <div>
                  <h2 className="text-xl font-extrabold text-white uppercase tracking-wider">Retícula Oficial ITIC-2010-225</h2>
                  <p className="text-xs text-blue-300 mt-1">Haz clic en una materia para ver sus materias previas y consecuentes.</p>
                </div>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-9 gap-4 overflow-x-auto pb-8">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((sem) => (
                  <div key={sem} className="flex flex-col gap-3 min-w-[170px]">
                    <div className="bg-blue-900/60 backdrop-blur-sm border border-blue-500/50 text-white text-center py-2 rounded-lg font-extrabold text-xs uppercase shadow-lg shadow-blue-900/50">{sem}° Semestre</div>
                    
                    {(materias || []).filter((m) => m.semestre === sem).map((m) => {
                      const tieneEvidencias = m.total_evidencias > 0;
                      return (
                        <div 
                          key={m.id} 
                          onClick={() => setMateriaModal(m)} 
                          className={`relative p-3 rounded-lg cursor-pointer transition-all duration-300 flex flex-col justify-between min-h-[120px] border-2 ${
                            tieneEvidencias 
                              ? "bg-emerald-900/40 border-emerald-500/70 hover:border-emerald-400 text-white shadow-[0_0_15px_rgba(16,185,129,0.2)]" 
                              : "bg-slate-800/80 border-slate-600/50 hover:border-blue-400 hover:bg-slate-700/80"
                          }`}
                        >
                          <div className="font-bold text-[11px] text-center leading-tight mb-2">{m.nombre}</div>
                          <div className="mt-auto pt-2 border-t border-white/10 text-[10px] flex justify-between font-mono items-center">
                            <span className="text-blue-300 bg-blue-950/50 px-1.5 py-0.5 rounded">{m.clave}</span>
                            <span className={tieneEvidencias ? "text-emerald-400 font-bold" : "text-slate-400"}>
                              {tieneEvidencias ? `✓ ${m.total_evidencias}` : "Ver info"}
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* 4. SUBIR EVIDENCIAS */}
          {vistaActual === "subir" && (
            <section className="max-w-3xl mx-auto px-6 py-10">
              <div className="p-8 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-slate-700 shadow-2xl">
                <span className="px-3 py-1 rounded-full bg-blue-900/50 text-blue-300 border border-blue-500/50 text-xs font-bold uppercase tracking-wider">Analizador de Evidencias</span>
                <h2 className="text-3xl font-extrabold text-white mt-4 mb-6">Subir Proyecto</h2>
                
                <form onSubmit={guardarEvidenciaConIA} className="space-y-5">
                  {alerta && <div className={`p-4 rounded-xl border text-sm ${alerta.tipo === "ok" ? "bg-emerald-900/50 border-emerald-500/50 text-emerald-200" : "bg-red-900/50 border-red-500/50 text-red-200"}`}><div className="font-bold">{alerta.msg}</div></div>}
                  
                  <div>
                    <label className="block text-xs font-bold text-blue-400 mb-1 uppercase tracking-wider">Materia *</label>
                    <select value={materiaSeleccionada} onChange={(e) => setMateriaSeleccionada(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white focus:border-blue-500 focus:outline-none">
                      {(materias || []).map((m) => (<option key={m.id} value={m.id}>[{m.semestre}°] {m.clave} - {m.nombre}</option>))}
                    </select>
                  </div>
                  
                  <div><label className="block text-xs font-bold text-blue-400 mb-1 uppercase tracking-wider">Título del Proyecto *</label><input type="text" required value={titulo} onChange={(e) => setTitulo(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white focus:border-blue-500 focus:outline-none" /></div>
                  <div><label className="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Descripción (Opcional)</label><textarea rows="2" value={descripcion} onChange={(e) => setDescripcion(e.target.value)} className="w-full p-3 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white focus:border-blue-500 focus:outline-none" /></div>
                  
                  <div className="p-6 rounded-xl border-2 border-dashed border-blue-500/40 bg-blue-950/20 text-center hover:bg-blue-900/20 transition-all">
                    <label className="block text-sm font-bold text-blue-300 mb-2 cursor-pointer">
                      <span className="text-2xl mb-2 block">📁</span>
                      Arrastra o haz clic para subir archivos
                    </label>
                    <p className="text-xs text-slate-400 mb-4">PDF, ZIP, Excel, Código, Videos (Máx 50MB)</p>
                    <input type="file" multiple onChange={(e) => setColaArchivos([...colaArchivos, ...Array.from(e.target.files)])} className="w-full text-xs text-slate-300 file:bg-blue-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-lg file:cursor-pointer" />
                    {colaArchivos.length > 0 && <div className="mt-4 pt-4 border-t border-blue-500/20 text-left space-y-2">{colaArchivos.map((f, i) => (<div key={i} className="flex justify-between items-center bg-slate-900/80 px-3 py-2 rounded-lg text-xs border border-slate-700"><span className="text-white truncate max-w-[80%]">📄 {f.name}</span><button type="button" onClick={() => setColaArchivos(colaArchivos.filter((_, idx) => idx !== i))} className="text-red-400 font-bold hover:text-red-300">✕</button></div>))}</div>}
                  </div>
                  
                  <button type="submit" disabled={subiendo} className="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 font-extrabold text-white text-sm uppercase tracking-wider shadow-lg transform transition hover:scale-[1.02]">
                    {subiendo ? "Analizando con IA..." : `Guardar y Analizar (${colaArchivos.length} Archivos)`}
                  </button>
                </form>
              </div>
            </section>
          )}

          {/* 5. PORTAFOLIO Y CURRÍCULUM */}
          {vistaActual === "portafolio" && (
            <section className="max-w-7xl mx-auto px-6 py-10">
              {!datosPortafolio ? <div className="text-center text-slate-400 p-10 font-bold animate-pulse">Cargando tu portafolio...</div> : (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                  <aside className="lg:col-span-4 space-y-6">
                    <div className="p-6 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-slate-700 shadow-2xl">
                      <div className="flex items-center gap-4 pb-6 border-b border-slate-700">
                        {datosPortafolio.estudiante?.foto_url ? <img src={`${API_BASE}${datosPortafolio.estudiante.foto_url}`} className="w-20 h-20 rounded-2xl object-cover border-2 border-emerald-400 shadow-lg" /> : <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-600 to-emerald-500 flex items-center justify-center text-2xl font-extrabold text-white shadow-lg">{(datosPortafolio.estudiante?.nombre || "U").slice(0, 2).toUpperCase()}</div>}
                        <div>
                          <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-700 text-[10px] font-bold uppercase tracking-wider">✓ Verificado</span>
                          <h2 className="text-xl font-extrabold text-white mt-1 leading-tight">{datosPortafolio.estudiante?.nombre}</h2>
                        </div>
                      </div>
                      
                      <div className="py-5 border-b border-slate-700">
                        <div className="text-xs font-bold text-blue-400 mb-2 uppercase tracking-wider">Perfil Profesional IA</div>
                        <p className="text-sm text-slate-300 leading-relaxed text-justify">{datosPortafolio.estudiante?.perfil_ia}</p>
                      </div>
                      
                      <div className="py-5 border-b border-slate-700 space-y-3 text-sm">
                        <div className="flex justify-between items-center"><span className="text-slate-400">Matrícula:</span><span className="font-mono font-bold text-white bg-slate-800 px-2 py-0.5 rounded">{datosPortafolio.estudiante?.matricula}</span></div>
                        <div className="flex justify-between items-center"><span className="text-slate-400">Correo:</span><span className="font-mono text-emerald-400 text-xs">{datosPortafolio.estudiante?.correo}</span></div>
                        <div className="flex justify-between items-center"><span className="text-slate-400">Semestre:</span><span className="font-extrabold text-white bg-blue-900/50 px-2 py-0.5 rounded border border-blue-700/50">{datosPortafolio.estudiante?.semestre_actual}°</span></div>
                      </div>
                      
                      <div className="py-5 border-b border-slate-700">
                        <h3 className="text-xs font-bold text-emerald-400 mb-2 uppercase tracking-wider">Stack Detectado</h3>
                        {(datosPortafolio.metricas?.stack_dominado || []).length > 0 ? <div className="flex flex-wrap gap-2">{(datosPortafolio.metricas.stack_dominado || []).map((t) => <span key={t} className="px-2.5 py-1 rounded-md bg-blue-950/80 text-blue-300 text-xs font-bold border border-blue-700/50 shadow-sm">✓ {t}</span>)}</div> : <p className="text-xs text-slate-500 italic">Sube archivos para que la IA detecte tus habilidades.</p>}
                      </div>
                      
                      <div className="pt-5 space-y-3 print:hidden">
                        <button onClick={() => window.print()} className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm shadow-lg shadow-blue-600/30 transition-all">🖨️ Imprimir CV</button>
                        <button onClick={() => setVistaActual("subir")} className="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm border border-slate-600 transition-all">+ Subir Evidencia</button>
                      </div>
                    </div>
                  </aside>
                  
                  <div className="lg:col-span-8 space-y-6">
                    <div className="p-6 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-slate-700 flex justify-between items-center shadow-lg">
                      <h3 className="text-xl font-extrabold text-white">Historial Académico</h3>
                      <select value={semestreActivoHistorial} onChange={(e) => setSemestreActivoHistorial(e.target.value)} className="p-2.5 rounded-lg bg-slate-950 border border-slate-700 text-xs font-bold text-white focus:outline-none">
                        <option value="TODOS">Todos los semestres</option>
                        {[1,2,3,4,5,6,7,8,9].map(s => <option key={s} value={s}>{s}° Semestre</option>)}
                      </select>
                    </div>
                    
                    <div className="relative border-l-2 border-blue-500/30 ml-4 pl-8 space-y-8">
                      {construirHistorialPorSemestre().map((b) => (
                        <div key={b.semestre} className="relative">
                          <div className={`absolute -left-[41px] top-1 w-5 h-5 rounded-full border-4 border-slate-950 ${b.totalEvidenciasSemestre > 0 ? "bg-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.8)]" : "bg-slate-600"}`} />
                          
                          <div className="p-4 rounded-xl bg-slate-800/80 border border-slate-600 flex justify-between mb-4 shadow-sm">
                            <span className="font-extrabold text-white">{b.semestre}° Semestre</span>
                            <span className="text-xs text-emerald-400 font-bold bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-800/50">{b.totalEvidenciasSemestre} proyecto(s)</span>
                          </div>
                          
                          <div className="space-y-4">
                            {b.materias.map((mat) => (
                              <div key={mat.id} className={`p-5 rounded-xl border transition-all ${mat.evidencias.length > 0 ? "bg-slate-900/90 border-emerald-500/50 shadow-lg shadow-emerald-900/20" : "bg-slate-900/40 border-slate-700"}`}>
                                <div className="flex justify-between items-center">
                                  <div>
                                    <span className="font-mono text-xs text-blue-400 font-bold mr-2 bg-blue-950/50 px-2 py-0.5 rounded border border-blue-800/50">{mat.clave}</span>
                                    <span className="font-bold text-white text-base">{mat.nombre}</span>
                                  </div>
                                  <button onClick={() => { setMateriaSeleccionada(mat.id); setVistaActual("subir"); }} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-blue-300 border border-slate-600 transition-all">+ Subir</button>
                                </div>
                                {mat.evidencias.length > 0 && (
                                  <div className="mt-4 pt-4 border-t border-slate-700 space-y-4">
                                    {mat.evidencias.map((ev) => (
                                      <div key={ev.id} className="p-4 rounded-xl bg-slate-950/80 border border-slate-800">
                                        <div className="flex justify-between items-start mb-2">
                                          <h5 className="font-bold text-white text-sm">{ev.titulo}</h5>
                                          <span className="text-[10px] text-slate-500 font-mono bg-slate-900 px-2 py-0.5 rounded">{ev.fecha}</span>
                                        </div>
                                        {ev.analisis_ia && <p className="text-xs text-emerald-200 mt-2 bg-emerald-950/30 p-3 rounded-lg border border-emerald-800/40 leading-relaxed">{ev.analisis_ia}</p>}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-4">
                                          {(ev.archivos || []).map((arch) => (
                                            <div key={arch.id} className="p-2.5 rounded-lg bg-slate-900 border border-slate-700 flex justify-between items-center text-xs">
                                              <span className="truncate text-slate-300 mr-2">📎 {arch.nombre}</span>
                                              <div className="flex gap-1 shrink-0">
                                                <button onClick={() => previsualizarArchivo(arch)} className="px-2.5 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white font-bold transition-all">Abrir</button>
                                                <a href={`${API_BASE}${arch.url}`} download={arch.nombre} className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white font-bold border border-slate-600 transition-all">↓</a>
                                              </div>
                                            </div>
                                          ))}
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </section>
          )}

          {/* MODAL DE INFORMACIÓN DE MATERIA (RETÍCULA) */}
          {materiaModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-600 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
                <button onClick={() => setMateriaModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center">✕</button>
                
                <h3 className="text-xl font-extrabold text-white mb-1 pr-8">{materiaModal.nombre}</h3>
                <div className="flex gap-2 mb-6">
                  <span className="text-xs font-mono bg-blue-950 text-blue-300 px-2 py-1 rounded border border-blue-800">{materiaModal.clave}</span>
                  <span className="text-xs font-bold bg-slate-800 text-slate-300 px-2 py-1 rounded">{materiaModal.semestre}° Semestre</span>
                </div>

                <div className="space-y-6">
                  {/* Materias Previas */}
                  <div>
                    <h4 className="text-sm font-bold text-amber-400 mb-2 flex items-center gap-2">
                      <span className="text-lg">⬅️</span> Materias Previas (Requisitos)
                    </h4>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 min-h-[60px]">
                      {RETICULA_DEPENDENCIAS[materiaModal.clave]?.previas.length > 0 ? (
                        <ul className="list-disc list-inside text-sm text-slate-300 space-y-1">
                          {RETICULA_DEPENDENCIAS[materiaModal.clave].previas.map(clave => (
                            <li key={clave}>{obtenerNombreMateria(clave)} <span className="text-xs text-slate-500 font-mono">({clave})</span></li>
                          ))}
                        </ul>
                      ) : (
                        <p className="text-xs text-slate-500 italic">No tiene materias previas registradas (Materia de inicio).</p>
                      )}
                    </div>
                  </div>

                  {/* Materias Siguientes */}
                  <div>
                    <h4 className="text-sm font-bold text-emerald-400 mb-2 flex items-center gap-2">
                      <span className="text-lg">➡️</span> Desbloquea las materias:
                    </h4>
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 min-h-[60px]">
                      {RETICULA_DEPENDENCIAS[materiaModal.clave]?.siguientes.length > 0 ? (
                        <ul className="list-disc list-inside text-sm text-slate-300 space-y-1">
                          {RETICULA_DEPENDENCIAS[materiaModal.clave].siguientes.map(clave => (
                            <li key={clave}>{obtenerNombreMateria(clave)} <span className="text-xs text-slate-500 font-mono">({clave})</span></li>
                          ))}
                        </ul>
                      ) : (
                        <p className="text-xs text-slate-500 italic">No desbloquea materias posteriores en la retícula.</p>
                      )}
                    </div>
                  </div>
                </div>

                <div className="mt-8 flex justify-end">
                  <button onClick={() => { setMateriaSeleccionada(materiaModal.id); setVistaActual(usuarioActivo ? "subir" : "auth"); setMateriaModal(null); }} className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-white text-sm shadow-lg shadow-blue-600/30 transition-all">
                    {usuarioActivo ? "+ Subir Evidencia aquí" : "Iniciar Sesión para subir"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* VISOR DE ARCHIVOS */}
          {archivoEnVisor && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-6xl w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 border-b border-slate-700 pb-4">
                  <h4 className="font-bold text-white text-lg flex items-center gap-2"><span className="text-2xl">📎</span> {archivoEnVisor.nombre}</h4>
                  <button onClick={() => setArchivoEnVisor(null)} className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-all">Cerrar ✕</button>
                </div>
                <div className="flex justify-center items-center min-h-[60vh] bg-slate-950 rounded-xl overflow-hidden">
                  {archivoEnVisor.tipo === "IMAGEN" ? <img src={`${API_BASE}${archivoEnVisor.url}`} className="max-h-[70vh] object-contain" /> 
                  : archivoEnVisor.tipo === "VIDEO" || archivoEnVisor.nombre?.toLowerCase().endsWith(".mp4") ? <video controls autoPlay className="max-h-[70vh] w-full"><source src={`${API_BASE}${archivoEnVisor.url}`} /></video> 
                  : textoCodigoVisor ? <pre className="w-full bg-slate-900 text-emerald-300 p-6 rounded-xl text-sm font-mono overflow-auto max-h-[70vh]">{textoCodigoVisor}</pre> 
                  : <iframe src={`${API_BASE}${archivoEnVisor.url}`} className="w-full h-[70vh] bg-white" />}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PortafolioITPApp />);
  </script>
</body>
</html>
