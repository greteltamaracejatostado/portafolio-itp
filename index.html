<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio Académico ITP con Inteligencia Artificial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    // Detecta automáticamente si está en localhost o desplegado en una página real desde GitHub
    const API_BASE = window.location.origin.includes("http") ? window.location.origin : "http://localhost:8000";

    function PortafolioITPApp() {
      const [usuarioActivo, setUsuarioActivo] = useState(() => {
        const guardado = localStorage.getItem("itp_usuario_sesion");
        return guardado ? JSON.parse(guardado) : null;
      });

      const [vistaActual, setVistaActual] = useState(usuarioActivo ? "portafolio" : "inicio");
      const [materias, setMaterias] = useState([]);

      // Estados de Registro e Inicio de Sesión
      const [modoAuth, setModoAuth] = useState("registro"); // "registro" | "login"
      const [nombreReg, setNombreReg] = useState("");
      const [matriculaReg, setMatriculaReg] = useState("");
      const [correoReg, setCorreoReg] = useState("");
      const [passwordReg, setPasswordReg] = useState("");
      const [esIticsReg, setEsIticsReg] = useState(true);
      const [modoSemestreReg, setModoSemestreReg] = useState("AUTOMATICO");
      const [semestreManualReg, setSemestreManualReg] = useState(1);
      const [fechaInicioReg, setFechaInicioReg] = useState("");
      const [fechaFinReg, setFechaFinReg] = useState("");
      const [fotoReg, setFotoReg] = useState(null);
      const [errorAuth, setErrorAuth] = useState(null);

      // Estados para Subir Evidencias con IA
      const [materiaSeleccionada, setMateriaSeleccionada] = useState("");
      const [titulo, setTitulo] = useState("");
      const [descripcion, setDescripcion] = useState("");
      const [urlExterna, setUrlExterna] = useState("");
      const [colaArchivos, setColaArchivos] = useState([]);
      const [subiendo, setSubiendo] = useState(false);
      const [alerta, setAlerta] = useState(null);

      // Estados del CV e Historial
      const [datosPortafolio, setDatosPortafolio] = useState(null);
      const [mostrarTodosLosSemestres, setMostrarTodosLosSemestres] = useState(true);
      const [semestreActivoHistorial, setSemestreActivoHistorial] = useState("TODOS");
      const [archivoEnVisor, setArchivoEnVisor] = useState(null);
      const [textoCodigoVisor, setTextoCodigoVisor] = useState("");

      const cargarDatosUsuario = async (userObj = usuarioActivo) => {
        try {
          const idParam = userObj ? `?estudiante_id=${userObj.id}` : "";
          const rMat = await fetch(`${API_BASE}/api/reticula/materias${idParam}`);
          const dataMat = await rMat.json();
          setMaterias(dataMat);
          if (dataMat.length > 0 && !materiaSeleccionada) {
            setMateriaSeleccionada(dataMat[0].id);
          }

          if (userObj) {
            const rPort = await fetch(`${API_BASE}/api/portafolio/${userObj.id}`);
            if (rPort.ok) {
              setDatosPortafolio(await rPort.json());
            }
          }
        } catch (err) {
          console.error("Error de conexión:", err);
        }
      };

      useEffect(() => {
        cargarDatosUsuario();
      }, [usuarioActivo]);

      const manejarRegistro = async (e) => {
        e.preventDefault();
        setErrorAuth(null);

        const fd = new FormData();
        fd.append("nombre_completo", nombreReg);
        fd.append("matricula", matriculaReg);
        fd.append("correo", correoReg);
        fd.append("password", passwordReg);
        fd.append("es_itics", esIticsReg);
        fd.append("modo_semestre", modoSemestreReg);
        fd.append("semestre_base", semestreManualReg);
        if (modoSemestreReg === "AUTOMATICO" && fechaInicioReg && fechaFinReg) {
          fd.append("fecha_inicio_semestre", fechaInicioReg);
          fd.append("fecha_fin_semestre", fechaFinReg);
        }
        if (fotoReg) {
          fd.append("foto", fotoReg);
        }

        const res = await fetch(`${API_BASE}/api/auth/registro`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("itp_usuario_sesion", JSON.stringify(data.usuario));
          setUsuarioActivo(data.usuario);
          setVistaActual("portafolio");
        } else {
          setErrorAuth(data.detail || "Error al registrarse.");
        }
      };

      const manejarLogin = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        const fd = new FormData();
        fd.append("identificador", matriculaReg);
        fd.append("password", passwordReg);

        const res = await fetch(`${API_BASE}/api/auth/login`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("itp_usuario_sesion", JSON.stringify(data.usuario));
          setUsuarioActivo(data.usuario);
          setVistaActual("portafolio");
        } else {
          setErrorAuth(data.detail || "Credenciales incorrectas.");
        }
      };

      const cerrarSesion = () => {
        localStorage.removeItem("itp_usuario_sesion");
        setUsuarioActivo(null);
        setDatosPortafolio(null);
        setVistaActual("inicio");
      };

      const alSeleccionarArchivos = (e) => {
        const seleccionados = Array.from(e.target.files);
        if (seleccionados.length > 0) {
          setColaArchivos((prev) => [...prev, ...seleccionados]);
        }
        e.target.value = null;
      };

      const guardarEvidenciaConIA = async (e) => {
        e.preventDefault();
        if (!usuarioActivo) {
          setVistaActual("auth");
          return;
        }
        if (colaArchivos.length === 0 && !urlExterna.trim()) {
          setAlerta({ tipo: "error", msg: "Adjunta al menos 1 archivo (PDF, ZIP, Video, Código) para que la IA lo analice." });
          return;
        }

        setSubiendo(true);
        setAlerta(null);

        const fd = new FormData();
        fd.append("estudiante_id", usuarioActivo.id);
        fd.append("titulo", titulo);
        fd.append("descripcion", descripcion);
        fd.append("materia_id", materiaSeleccionada);
        if (urlExterna.trim()) fd.append("url_enlace_externo", urlExterna.trim());
        colaArchivos.forEach((f) => fd.append("archivos", f));

        try {
          const res = await fetch(`${API_BASE}/api/evidencias/subir`, { method: "POST", body: fd });
          const data = await res.json();
          if (res.ok) {
            setAlerta({ tipo: "ok", msg: data.mensaje, detalleIA: data.analisis_ia });
            setTitulo("");
            setDescripcion("");
            setUrlExterna("");
            setColaArchivos([]);
            await cargarDatosUsuario();
          } else {
            setAlerta({ tipo: "error", msg: data.detail || "Error al subir." });
          }
        } catch (err) {
          setAlerta({ tipo: "error", msg: "Error de conexión con el servidor." });
        } finally {
          setSubiendo(false);
        }
      };

      const previsualizarArchivo = async (arch) => {
        setArchivoEnVisor(arch);
        setTextoCodigoVisor("");
        const nombreLower = arch.nombre.toLowerCase();
        if (
          arch.tipo === "CODIGO" ||
          nombreLower.endsWith(".txt") ||
          nombreLower.endsWith(".md") ||
          nombreLower.endsWith(".sql") ||
          nombreLower.endsWith(".py") ||
          nombreLower.endsWith(".kt")
        ) {
          const res = await fetch(`${API_BASE}/api/archivos/leer-texto/${arch.id}`);
          if (res.ok) setTextoCodigoVisor(await res.text());
        }
      };

      const construirHistorialPorSemestre = () => {
        const mapaEvidenciasPorMateria = {};
        if (datosPortafolio && datosPortafolio.portafolio_por_materia) {
          datosPortafolio.portafolio_por_materia.forEach((bloque) => {
            mapaEvidenciasPorMateria[bloque.clave] = bloque.evidencias;
          });
        }

        return [1, 2, 3, 4, 5, 6, 7, 8, 9]
          .map((numSem) => {
            const materiasDelSemestre = materias.filter((m) => m.semestre === numSem);
            const materiasConHistorial = materiasDelSemestre.map((m) => ({
              ...m,
              evidencias: mapaEvidenciasPorMateria[m.clave] || [],
            }));
            const totalEvidenciasSemestre = materiasConHistorial.reduce((acc, m) => acc + m.evidencias.length, 0);
            return { semestre: numSem, materias: materiasConHistorial, totalEvidenciasSemestre };
          })
          .filter((s) => {
            if (semestreActivoHistorial !== "TODOS" && s.semestre !== Number(semestreActivoHistorial)) return false;
            if (!mostrarTodosLosSemestres && s.totalEvidenciasSemestre === 0) return false;
            return true;
          });
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
          {/* BARRA DE NAVEGACIÓN */}
          <nav className="border-b border-slate-800 bg-slate-900 sticky top-0 z-40 print:hidden">
            <div className="max-w-7xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setVistaActual("inicio")}>
                <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-lg">ITP</div>
                <div>
                  <span className="font-bold text-white block leading-none">Portafolio Académico ITP con IA</span>
                  <span className="text-xs text-blue-400">Ingeniería en TICs • Retícula Oficial ITIC-2010-225</span>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => setVistaActual("inicio")}
                  className={`px-3.5 py-2 text-xs font-bold rounded-lg transition ${vistaActual === "inicio" ? "bg-blue-600 text-white" : "bg-slate-800 hover:bg-slate-700"}`}
                >
                  Inicio
                </button>
                <button
                  onClick={() => setVistaActual("reticula")}
                  className={`px-3.5 py-2 text-xs font-bold rounded-lg transition ${vistaActual === "reticula" ? "bg-blue-600 text-white" : "bg-slate-800 hover:bg-slate-700"}`}
                >
                  Retícula ({materias.length} Materias)
                </button>

                {usuarioActivo ? (
                  <>
                    <button
                      onClick={() => setVistaActual("subir")}
                      className={`px-3.5 py-2 text-xs font-bold rounded-lg transition ${vistaActual === "subir" ? "bg-blue-600 text-white" : "bg-slate-800 hover:bg-slate-700"}`}
                    >
                      + Subir Evidencia con IA
                    </button>
                    <button
                      onClick={() => { cargarDatosUsuario(); setVistaActual("portafolio"); }}
                      className={`px-3.5 py-2 text-xs font-bold rounded-lg transition ${vistaActual === "portafolio" ? "bg-emerald-600 text-white" : "bg-emerald-700 hover:bg-emerald-600 text-white"}`}
                    >
                      Mi CV ({usuarioActivo.nombre.split(" ")[0]})
                    </button>
                    <button
                      onClick={cerrarSesion}
                      className="px-3 py-2 text-xs font-bold rounded-lg bg-red-950/70 text-red-300 border border-red-800 hover:bg-red-900"
                    >
                      Salir
                    </button>
                  </>
                ) : (
                  <>
                    <button
                      onClick={() => { setModoAuth("login"); setVistaActual("auth"); }}
                      className="px-4 py-2 text-xs font-bold rounded-lg bg-slate-800 hover:bg-slate-700 text-white"
                    >
                      Iniciar Sesión
                    </button>
                    <button
                      onClick={() => { setModoAuth("registro"); setVistaActual("auth"); }}
                      className="px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow"
                    >
                      Crear Cuenta Estudiantil
                    </button>
                  </>
                )}
              </div>
            </div>
          </nav>

          {/* 1. PANTALLA DE INICIO (EXPLICACIÓN DE LA PLATAFORMA) */}
          {vistaActual === "inicio" && (
            <main className="max-w-6xl mx-auto px-6 py-16">
              <div className="text-center max-w-4xl mx-auto">
                <span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-950 text-blue-300 border border-blue-800">
                  Instituto Tecnológico de Puebla • Metodología CommonKADS + Inteligencia Artificial
                </span>
                <h1 className="text-4xl md:text-6xl font-extrabold mt-6 text-white leading-tight">
                  Tu Portafolio Académico y CV Técnico{" "}
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                    Analizado por Inteligencia Artificial
                  </span>
                </h1>
                <p className="mt-6 text-base md:text-lg text-slate-300 leading-relaxed">
                  Los sistemas escolares tradicionales solo guardan una calificación numérica. En esta plataforma te registras con tu número de control, subes tus prácticas (PDFs, proyectos ZIP, videos o código) y nuestra <strong>Inteligencia Artificial lee tus archivos</strong> para detectar automáticamente tu stack tecnológico y armar tu Currículum Verificable de 1° a 9° semestre.
                </p>

                <div className="mt-10 flex flex-wrap justify-center gap-4">
                  {!usuarioActivo ? (
                    <>
                      <button
                        onClick={() => { setModoAuth("registro"); setVistaActual("auth"); }}
                        className="px-8 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 font-extrabold text-white shadow-lg shadow-blue-600/30 transition"
                      >
                        Comenzar Mi Registro Estudiantil →
                      </button>
                      <button
                        onClick={() => { setModoAuth("login"); setVistaActual("auth"); }}
                        className="px-8 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-slate-200 border border-slate-700 transition"
                      >
                        Ya tengo cuenta (Iniciar Sesión)
                      </button>
                    </>
                  ) : (
                    <button
                      onClick={() => setVistaActual("portafolio")}
                      className="px-8 py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-extrabold text-white shadow-lg"
                    >
                      Ir a Mi Currículum e Historial ({usuarioActivo.nombre}) →
                    </button>
                  )}
                </div>
              </div>

              <div className="grid md:grid-cols-3 gap-6 mt-16">
                <div className="p-6 rounded-2xl bg-slate-900 border border-slate-800">
                  <div className="text-blue-400 font-extrabold text-lg mb-2">1. Avance Semestral Inteligente</div>
                  <p className="text-sm text-slate-300">
                    Registra la fecha de inicio y término de tu semestre para que el sistema actualice tu grado automáticamente, o elígelo de forma manual cuando lo necesites.
                  </p>
                </div>
                <div className="p-6 rounded-2xl bg-slate-900 border border-slate-800">
                  <div className="text-emerald-400 font-extrabold text-lg mb-2">2. IA que lee tus PDFs y ZIPs</div>
                  <p className="text-sm text-slate-300">
                    No necesitas escribir qué tecnologías sabes. La IA inspecciona el contenido de tus PDFs, archivos comprimidos y códigos para extraer tu Stack Tecnológico real.
                  </p>
                </div>
                <div className="p-6 rounded-2xl bg-slate-900 border border-slate-800">
                  <div className="text-amber-400 font-extrabold text-lg mb-2">3. Historial de 1° a 9° Semestre</div>
                  <p className="text-sm text-slate-300">
                    Vinculado a las 54 asignaturas de la retícula oficial de ITICs (ITIC-2010-225) y la especialidad de Análisis de Datos del ITP.
                  </p>
                </div>
              </div>
            </main>
          )}

          {/* 2. PANTALLA DE REGISTRO COMPLETO E INICIO DE SESIÓN */}
          {vistaActual === "auth" && (
            <section className="max-w-2xl mx-auto px-6 py-10">
              <div className="p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl">
                <div className="flex gap-2 mb-6 p-1 bg-slate-950 rounded-xl border border-slate-800">
                  <button
                    onClick={() => { setModoAuth("registro"); setErrorAuth(null); }}
                    className={`flex-1 py-2.5 rounded-lg text-xs font-extrabold uppercase transition ${modoAuth === "registro" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                  >
                    Crear Cuenta Nueva
                  </button>
                  <button
                    onClick={() => { setModoAuth("login"); setErrorAuth(null); }}
                    className={`flex-1 py-2.5 rounded-lg text-xs font-extrabold uppercase transition ${modoAuth === "login" ? "bg-blue-600 text-white" : "text-slate-400"}`}
                  >
                    Iniciar Sesión
                  </button>
                </div>

                {errorAuth && (
                  <div className="mb-4 p-3.5 rounded-xl bg-red-950 border border-red-600 text-red-200 text-xs font-semibold">
                    {errorAuth}
                  </div>
                )}

                {modoAuth === "registro" ? (
                  <form onSubmit={manejarRegistro} className="space-y-4">
                    <h2 className="text-xl font-extrabold text-white">Registro de Estudiante ITP</h2>
                    <p className="text-xs text-slate-400">
                      Tus datos se usarán para generar el encabezado oficial de tu Currículum Vitae y tu historial por semestre.
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase text-blue-400 mb-1">Nombre Completo *</label>
                        <input
                          type="text"
                          required
                          value={nombreReg}
                          onChange={(e) => setNombreReg(e.target.value)}
                          placeholder="Ej. Nombre Apellido Paterno Materno"
                          className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-blue-400 mb-1">Número de Control (Matrícula) *</label>
                        <input
                          type="text"
                          required
                          value={matriculaReg}
                          onChange={(e) => setMatriculaReg(e.target.value)}
                          placeholder="Ej. 23221036"
                          className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase text-blue-400 mb-1">Correo Institucional *</label>
                        <input
                          type="email"
                          required
                          value={correoReg}
                          onChange={(e) => setCorreoReg(e.target.value)}
                          placeholder="Ej. L23221036@puebla.tecnm.mx"
                          className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-blue-400 mb-1">Contraseña *</label>
                        <input
                          type="password"
                          required
                          value={passwordReg}
                          onChange={(e) => setPasswordReg(e.target.value)}
                          placeholder="Crea una contraseña segura"
                          className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase text-blue-400 mb-1">¿Perteneces a la carrera de ITICs? *</label>
                        <select
                          value={esIticsReg}
                          onChange={(e) => setEsIticsReg(e.target.value === "true")}
                          className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                        >
                          <option value="true">Sí - Ing. en Tecnologías de la Información y Comunicaciones (ITIC-2010-225)</option>
                          <option value="false">Otra Ingeniería del ITP</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-emerald-400 mb-1">Foto de Perfil para tu CV (Opcional)</label>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => setFotoReg(e.target.files[0])}
                          className="w-full text-xs text-slate-300 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white cursor-pointer"
                        />
                      </div>
                    </div>

                    {/* CONFIGURACIÓN INTELIGENTE DEL SEMESTRE (POR FECHAS O MANUAL) */}
                    <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                      <label className="block text-xs font-extrabold uppercase text-amber-400">
                        Control de Semestre en Curso (Automático por Fechas o Manual)
                      </label>
                      <div className="flex flex-wrap gap-3 text-xs">
                        <label className="flex items-center gap-2 cursor-pointer">
                          <input
                            type="radio"
                            checked={modoSemestreReg === "AUTOMATICO"}
                            onChange={() => setModoSemestreReg("AUTOMATICO")}
                          />
                          <span>Automático con fechas de inicio y fin de semestre</span>
                        </label>
                        <label className="flex items-center gap-2 cursor-pointer">
                          <input
                            type="radio"
                            checked={modoSemestreReg === "MANUAL"}
                            onChange={() => setModoSemestreReg("MANUAL")}
                          />
                          <span>No quiero poner fechas (Elegir mi semestre manualmente)</span>
                        </label>
                      </div>

                      <div>
                        <label className="block text-xs text-slate-300 mb-1">
                          ¿En qué semestre te encuentras actualmente? *
                        </label>
                        <select
                          value={semestreManualReg}
                          onChange={(e) => setSemestreManualReg(Number(e.target.value))}
                          className="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                        >
                          {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((s) => (
                            <option key={s} value={s}>{s}° Semestre</option>
                          ))}
                        </select>
                      </div>

                      {modoSemestreReg === "AUTOMATICO" && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">Fecha de Inicio de tu Semestre</label>
                            <input
                              type="date"
                              value={fechaInicioReg}
                              onChange={(e) => setFechaInicioReg(e.target.value)}
                              className="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                            />
                          </div>
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">Fecha de Finalización de tu Semestre</label>
                            <input
                              type="date"
                              value={fechaFinReg}
                              onChange={(e) => setFechaFinReg(e.target.value)}
                              className="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
                            />
                          </div>
                          <p className="md:col-span-2 text-[11px] text-emerald-400">
                            ✓ Cuando pase la fecha de finalización, tu perfil pasará automáticamente al siguiente semestre. Si dejas las fechas vacías, se usará el semestre manual sin fallar.
                          </p>
                        </div>
                      )}
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 font-extrabold text-white text-sm uppercase tracking-wider shadow-lg"
                    >
                      Completar Registro y Crear Mi Portafolio
                    </button>
                  </form>
                ) : (
                  <form onSubmit={manejarLogin} className="space-y-4">
                    <h2 className="text-xl font-extrabold text-white">Iniciar Sesión</h2>
                    <div>
                      <label className="block text-xs font-bold uppercase text-blue-400 mb-1">
                        Número de Control o Correo Institucional *
                      </label>
                      <input
                        type="text"
                        required
                        value={matriculaReg}
                        onChange={(e) => setMatriculaReg(e.target.value)}
                        placeholder="Ej. 23221036 o L23221036@puebla.tecnm.mx"
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-blue-400 mb-1">Contraseña *</label>
                      <input
                        type="password"
                        required
                        value={passwordReg}
                        onChange={(e) => setPasswordReg(e.target.value)}
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-extrabold text-white text-sm uppercase"
                    >
                      Entrar a Mi Portafolio
                    </button>
                  </form>
                )}
              </div>
            </section>
          )}

          {/* 3. VISTA RETÍCULA OFICIAL EN 9 COLUMNAS */}
          {vistaActual === "reticula" && (
            <section className="max-w-[1600px] mx-auto px-4 py-6">
              <div className="mb-4 bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <div>
                  <h2 className="text-lg font-extrabold text-white uppercase">
                    Mapa Curricular Oficial ITIC-2010-225 (1° a 9° Semestre)
                  </h2>
                  <p className="text-xs text-slate-400">
                    Selecciona cualquier materia para subir tus evidencias y que la IA actualice tu CV.
                  </p>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-9 gap-2.5 overflow-x-auto pb-6">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((sem) => (
                  <div key={sem} className="flex flex-col gap-2.5 min-w-[155px]">
                    <div className="bg-blue-950 border border-blue-700 text-blue-200 text-center py-2 rounded-lg font-extrabold text-xs uppercase">
                      {sem}° Semestre
                    </div>
                    {materias
                      .filter((m) => m.semestre === sem)
                      .map((m) => (
                        <div
                          key={m.id}
                          onClick={() => {
                            setMateriaSeleccionada(m.id);
                            setVistaActual(usuarioActivo ? "subir" : "auth");
                          }}
                          className={`p-2.5 rounded-lg cursor-pointer transition flex flex-col justify-between min-h-[115px] ${
                            m.total_evidencias > 0
                              ? "bg-emerald-950 border-2 border-emerald-400 text-white"
                              : "bg-slate-900 border border-slate-700 hover:border-blue-400"
                          }`}
                        >
                          <div className="font-bold text-[11px] text-center leading-tight">{m.nombre}</div>
                          <div className="mt-2 pt-1.5 border-t border-white/10 text-[10px] flex justify-between font-mono">
                            <span className="text-blue-300">{m.clave}</span>
                            <span>{m.total_evidencias > 0 ? `✓ ${m.total_evidencias}` : "+ Subir"}</span>
                          </div>
                        </div>
                      ))}
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* 4. SUBIR ARCHIVOS CON LECTURA AUTOMÁTICA DE INTELIGENCIA ARTIFICIAL */}
          {vistaActual === "subir" && (
            <section className="max-w-3xl mx-auto px-6 py-8">
              <div className="p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl">
                <span className="px-2.5 py-1 rounded bg-blue-950 text-blue-300 border border-blue-800 text-xs font-bold">
                  Analizador de Evidencias con IA Activo
                </span>
                <h2 className="text-2xl font-extrabold text-white mt-2">
                  Subir Proyecto / Documentos a tu Historial
                </h2>
                <p className="text-xs text-slate-400 mt-1 mb-6">
                  Sube tus PDFs, ZIPs, videos o código. <strong>La Inteligencia Artificial leerá automáticamente tus archivos</strong> para detectar qué tecnologías ocupaste y redactar tu experiencia en el CV.
                </p>

                {alerta && (
                  <div className={`mb-6 p-4 rounded-xl border text-xs ${
                    alerta.tipo === "ok" ? "bg-emerald-950 border-emerald-500 text-emerald-200" : "bg-red-950 border-red-500 text-red-200"
                  }`}>
                    <div className="font-bold text-sm">{alerta.msg}</div>
                    {alerta.detalleIA && <div className="mt-1 text-slate-300 italic">{alerta.detalleIA}</div>}
                    {alerta.tipo === "ok" && (
                      <button
                        onClick={() => setVistaActual("portafolio")}
                        className="mt-3 px-4 py-1.5 rounded-lg bg-emerald-600 text-white font-bold"
                      >
                        Ver cómo quedó mi CV actualizado por la IA →
                      </button>
                    )}
                  </div>
                )}

                <form onSubmit={guardarEvidenciaConIA} className="space-y-4">
                  <div>
                    <label className="block text-xs uppercase font-bold text-blue-400 mb-1">
                      1. Materia de la Retícula *
                    </label>
                    <select
                      value={materiaSeleccionada}
                      onChange={(e) => setMateriaSeleccionada(e.target.value)}
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                    >
                      {materias.map((m) => (
                        <option key={m.id} value={m.id}>
                          [{m.semestre}° Semestre] {m.clave} - {m.nombre}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs uppercase font-bold text-blue-400 mb-1">
                      2. Título del Proyecto o Práctica *
                    </label>
                    <input
                      type="text"
                      required
                      value={titulo}
                      onChange={(e) => setTitulo(e.target.value)}
                      placeholder="Ej. Propuesta CommonKADS / Base de Datos SQL / Práctica de Redes"
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs uppercase font-semibold text-slate-400 mb-1">
                      Explicación adicional (Opcional - La IA también leerá tus archivos)
                    </label>
                    <textarea
                      rows="2"
                      value={descripcion}
                      onChange={(e) => setDescripcion(e.target.value)}
                      placeholder="Puedes escribir qué hiciste o dejar que la IA analice directamente tus PDFs y ZIPs..."
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs uppercase font-semibold text-slate-400 mb-1">
                      Enlace a GitHub / Repositorio (Opcional)
                    </label>
                    <input
                      type="url"
                      value={urlExterna}
                      onChange={(e) => setUrlExterna(e.target.value)}
                      placeholder="https://github.com/..."
                      className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white"
                    />
                  </div>

                  <div className="p-4 rounded-xl border-2 border-dashed border-blue-500/60 bg-slate-950">
                    <label className="block text-xs font-bold uppercase text-emerald-400 mb-2">
                      3. Selecciona tus Archivos (Varios PDFs, ZIPs, Videos MP4, Código, Imágenes)
                    </label>
                    <input
                      type="file"
                      multiple
                      onChange={alSeleccionarArchivos}
                      className="w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white font-bold cursor-pointer"
                    />

                    {colaArchivos.length > 0 && (
                      <div className="mt-4 pt-3 border-t border-slate-800 space-y-1.5">
                        <div className="text-xs font-bold text-amber-400">
                          Archivos listos para análisis IA ({colaArchivos.length}):
                        </div>
                        {colaArchivos.map((f, i) => (
                          <div key={i} className="flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-lg text-xs">
                            <span className="truncate text-white">📄 {f.name} ({(f.size / 1024).toFixed(1)} KB)</span>
                            <button
                              type="button"
                              onClick={() => setColaArchivos((prev) => prev.filter((_, idx) => idx !== i))}
                              className="text-red-400 font-bold ml-2"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <button
                    type="submit"
                    disabled={subiendo}
                    className="w-full py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-extrabold text-white text-sm uppercase tracking-wider shadow-lg transition cursor-pointer"
                  >
                    {subiendo
                      ? "🤖 Analizando tus PDFs/Archivos con IA y guardando..."
                      : `🤖 ANALIZAR CON IA Y GUARDAR EN MI CV (${colaArchivos.length} ARCHIVOS)`}
                  </button>
                </form>
              </div>
            </section>
          )}

          {/* 5. VISTA DE CURRÍCULUM VITAE GENERADO POR IA + HISTORIAL 1° A 9° SEMESTRE */}
          {vistaActual === "portafolio" && datosPortafolio && (
            <section className="max-w-7xl mx-auto px-6 py-8">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                {/* COLUMNA IZQUIERDA: CV DEL ESTUDIANTE REGISTRADO */}
                <aside className="lg:col-span-4 space-y-6">
                  <div className="p-6 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl">
                    <div className="flex items-center gap-4 pb-5 border-b border-slate-800">
                      {datosPortafolio.estudiante.foto_url ? (
                        <img
                          src={`${API_BASE}${datosPortafolio.estudiante.foto_url}`}
                          alt="Foto Perfil"
                          className="w-16 h-16 rounded-2xl object-cover border-2 border-emerald-400"
                        />
                      ) : (
                        <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-emerald-500 flex items-center justify-center text-xl font-extrabold text-white">
                          {datosPortafolio.estudiante.nombre.slice(0, 2).toUpperCase()}
                        </div>
                      )}
                      <div>
                        <span className="px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800 text-[10px] font-bold uppercase">
                          Currículum Verificado con IA
                        </span>
                        <h2 className="text-xl font-extrabold text-white mt-1 leading-tight">
                          {datosPortafolio.estudiante.nombre}
                        </h2>
                        <p className="text-xs text-emerald-400 font-semibold">
                          {datosPortafolio.estudiante.es_itics ? "Ingeniería en TICs • ITP" : "Ingeniería • ITP"}
                        </p>
                      </div>
                    </div>

                    {/* Perfil redactado por IA */}
                    <div className="py-4 border-b border-slate-800">
                      <div className="text-[11px] font-bold uppercase text-blue-400 mb-1">
                        🤖 Resumen Profesional Generado por IA
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">
                        {datosPortafolio.estudiante.perfil_ia}
                      </p>
                    </div>

                    {/* Datos del Alumno y Semestre Automático/Manual */}
                    <div className="py-4 border-b border-slate-800 space-y-2 text-xs">
                      <div className="flex justify-between">
                        <span className="text-slate-400">No. de Control:</span>
                        <span className="font-mono font-bold text-white">{datosPortafolio.estudiante.matricula}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Correo Institucional:</span>
                        <span className="font-mono text-blue-300">{datosPortafolio.estudiante.correo}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Semestre Vigente:</span>
                        <span className="font-extrabold text-emerald-400">{datosPortafolio.estudiante.semestre_actual}° Semestre</span>
                      </div>
                      <div className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] text-slate-300">
                        <span className="font-bold text-amber-400 block">{datosPortafolio.estudiante.modo_semestre}:</span>
                        {datosPortafolio.estudiante.explicacion_semestre}
                      </div>
                    </div>

                    {/* STACK TECNOLÓGICO DETECTADO AUTOMÁTICAMENTE POR LA IA */}
                    <div className="py-4 border-b border-slate-800">
                      <h3 className="text-xs font-bold uppercase text-emerald-400 mb-1">
                        🤖 Stack Tecnológico Detectado por IA en tus Archivos
                      </h3>
                      <p className="text-[11px] text-slate-400 mb-3">
                        Extraído automáticamente al inspeccionar tus PDFs, ZIPs, videos y códigos subidos:
                      </p>
                      {datosPortafolio.metricas.stack_dominado.length === 0 ? (
                        <div className="p-3 rounded-xl bg-slate-950 border border-dashed border-slate-800 text-xs text-slate-400">
                          Aún no hay tecnologías detectadas. Sube un PDF, ZIP o código para que la IA lo examine.
                        </div>
                      ) : (
                        <div className="flex flex-wrap gap-1.5">
                          {datosPortafolio.metricas.stack_dominado.map((tech) => (
                            <span
                              key={tech}
                              className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-blue-950 text-blue-300 border border-blue-700"
                            >
                              ✓ {tech}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="pt-4 space-y-2 print:hidden">
                      <button
                        onClick={() => window.print()}
                        className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase"
                      >
                        🖨️ Imprimir / Guardar CV en PDF
                      </button>
                      <button
                        onClick={() => setVistaActual("subir")}
                        className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase"
                      >
                        + Subir Más Archivos para Análisis IA
                      </button>
                    </div>
                  </div>
                </aside>

                {/* COLUMNA DERECHA: HISTORIAL DE 1° A 9° SEMESTRE */}
                <div className="lg:col-span-8 space-y-6">
                  <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-wrap justify-between items-center gap-4 print:hidden">
                    <div>
                      <h3 className="text-lg font-extrabold text-white">
                        Historial Académico Semestral (1° a 9° Semestre)
                      </h3>
                      <p className="text-xs text-slate-400">
                        Registro verificable de lo que has hecho a lo largo de cada semestre de tu carrera.
                      </p>
                    </div>

                    <div className="flex flex-wrap gap-2">
                      <select
                        value={semestreActivoHistorial}
                        onChange={(e) => setSemestreActivoHistorial(e.target.value)}
                        className="p-2 rounded-lg bg-slate-950 border border-slate-700 text-xs font-bold text-white"
                      >
                        <option value="TODOS">Todos los semestres (1° a 9°)</option>
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((s) => (
                          <option key={s} value={s}>{s}° Semestre</option>
                        ))}
                      </select>

                      <button
                        onClick={() => setMostrarTodosLosSemestres(!mostrarTodosLosSemestres)}
                        className="px-3 py-2 rounded-lg text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200"
                      >
                        {mostrarTodosLosSemestres ? "Ver Solo Materias con Evidencia" : "Ver Toda la Retícula"}
                      </button>
                    </div>
                  </div>

                  <div className="relative border-l-2 border-blue-600 ml-4 pl-6 space-y-8">
                    {construirHistorialPorSemestre().map((bloqueSem) => (
                      <div key={bloqueSem.semestre} className="relative">
                        <div className={`absolute -left-[33px] top-1 w-4 h-4 rounded-full border-4 border-slate-950 ${
                          bloqueSem.totalEvidenciasSemestre > 0 ? "bg-emerald-400" : "bg-slate-600"
                        }`} />

                        <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 flex justify-between items-center mb-3">
                          <span className="font-extrabold text-sm text-white">
                            {bloqueSem.semestre}° Semestre
                          </span>
                          <span className="text-xs text-emerald-400 font-bold">
                            {bloqueSem.totalEvidenciasSemestre} proyecto(s)
                          </span>
                        </div>

                        <div className="space-y-3">
                          {bloqueSem.materias
                            .filter((m) => mostrarTodosLosSemestres || m.evidencias.length > 0)
                            .map((mat) => (
                              <div
                                key={mat.id}
                                className={`p-4 rounded-xl border ${
                                  mat.evidencias.length > 0
                                    ? "bg-slate-900 border-emerald-500/60"
                                    : "bg-slate-900/40 border-slate-800"
                                }`}
                              >
                                <div className="flex justify-between items-center">
                                  <div>
                                    <span className="font-mono text-xs text-blue-400 font-bold mr-2">{mat.clave}</span>
                                    <span className="font-bold text-white text-sm">{mat.nombre}</span>
                                  </div>
                                  <button
                                    onClick={() => { setMateriaSeleccionada(mat.id); setVistaActual("subir"); }}
                                    className="px-2.5 py-1 rounded bg-slate-800 hover:bg-blue-600 text-xs font-bold print:hidden"
                                  >
                                    + Subir aquí
                                  </button>
                                </div>

                                {mat.evidencias.length > 0 && (
                                  <div className="mt-3 pt-3 border-t border-slate-800 space-y-3">
                                    {mat.evidencias.map((ev) => (
                                      <div key={ev.id} className="p-3.5 rounded-xl bg-slate-950 border border-slate-800">
                                        <div className="flex justify-between">
                                          <h5 className="font-bold text-white text-sm">{ev.titulo}</h5>
                                          <span className="text-[11px] text-slate-400 font-mono">{ev.fecha}</span>
                                        </div>

                                        {ev.analisis_ia && (
                                          <p className="text-xs text-emerald-300 mt-1.5 bg-emerald-950/40 p-2 rounded border border-emerald-800/50">
                                            🤖 {ev.analisis_ia}
                                          </p>
                                        )}

                                        {ev.tags_ia && ev.tags_ia.length > 0 && (
                                          <div className="flex flex-wrap gap-1.5 mt-2">
                                            {ev.tags_ia.map((t) => (
                                              <span key={t} className="px-2 py-0.5 rounded bg-blue-950 text-blue-300 text-[10px] font-bold">
                                                #{t}
                                              </span>
                                            ))}
                                          </div>
                                        )}

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-3">
                                          {ev.archivos.map((arch) => (
                                            <div key={arch.id} className="p-2 rounded bg-slate-900 border border-slate-800 flex justify-between items-center text-xs">
                                              <span className="truncate text-white">📎 {arch.nombre}</span>
                                              <div className="flex gap-1 shrink-0 print:hidden">
                                                <button
                                                  onClick={() => previsualizarArchivo(arch)}
                                                  className="px-2 py-1 rounded bg-blue-600 text-white font-bold"
                                                >
                                                  Abrir
                                                </button>
                                                <a
                                                  href={`${API_BASE}${arch.url}`}
                                                  download={arch.nombre}
                                                  className="px-2 py-1 rounded bg-slate-800 text-slate-200 font-bold"
                                                >
                                                  ↓
                                                </a>
                                              </div>
                                            </div>
                                          ))}
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>
          )}

          {/* MODAL VISOR UNIVERSAL (PDFs, VIDEOS MP4, IMÁGENES Y CÓDIGO) */}
          {archivoEnVisor && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-5xl w-full p-6">
                <div className="flex justify-between items-center mb-4">
                  <h4 className="font-bold text-white">{archivoEnVisor.nombre}</h4>
                  <button onClick={() => setArchivoEnVisor(null)} className="px-3 py-1 rounded bg-red-600 text-white text-xs font-bold">
                    Cerrar ✕
                  </button>
                </div>
                {archivoEnVisor.tipo === "IMAGEN" ? (
                  <img src={`${API_BASE}${archivoEnVisor.url}`} className="max-h-[70vh] mx-auto rounded" />
                ) : archivoEnVisor.tipo === "VIDEO" || archivoEnVisor.nombre.toLowerCase().endsWith(".mp4") ? (
                  <video controls autoPlay className="max-h-[70vh] w-full rounded">
                    <source src={`${API_BASE}${archivoEnVisor.url}`} />
                  </video>
                ) : textoCodigoVisor ? (
                  <pre className="bg-slate-950 text-emerald-300 p-4 rounded-xl text-xs font-mono overflow-auto max-h-[70vh]">
                    {textoCodigoVisor}
                  </pre>
                ) : (
                  <iframe src={`${API_BASE}${archivoEnVisor.url}`} className="w-full h-[70vh] rounded-xl bg-white" />
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PortafolioITPApp />);
  </script>
</body>
</html>
