<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio Académico ITP - Seguridad 2FA e IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.location.origin.includes("http") ? window.location.origin : "http://localhost:8000";

    function PortafolioITPApp() {
      const [usuarioActivo, setUsuarioActivo] = useState(() => {
        try {
          const guardado = localStorage.getItem("itp_usuario_sesion");
          return guardado ? JSON.parse(guardado) : null;
        } catch { return null; }
      });

      const [vistaActual, setVistaActual] = useState(usuarioActivo ? "portafolio" : "inicio");
      const [materias, setMaterias] = useState([]);

      // Flujos de Autenticación: "registro" | "verificar_correo" | "login" | "recuperar_correo" | "recuperar_nueva_clave"
      const [modoAuth, setModoAuth] = useState("registro");
      const [nombreReg, setNombreReg] = useState("");
      const [matriculaReg, setMatriculaReg] = useState("");
      const [correoReg, setCorreoReg] = useState("");
      const [passwordReg, setPasswordReg] = useState("");
      const [confirmarPasswordReg, setConfirmarPasswordReg] = useState("");
      const [modoSemestreReg, setModoSemestreReg] = useState("AUTOMATICO");
      const [semestreManualReg, setSemestreManualReg] = useState(1);
      const [fechaInicioReg, setFechaInicioReg] = useState("");
      const [fechaFinReg, setFechaFinReg] = useState("");
      const [fotoReg, setFotoReg] = useState(null);

      // Estado de Validación DNS MX en tiempo real del correo
      const [estadoCorreoMX, setEstadoCorreoMX] = useState(null); // { valido: bool, texto: string }
      const [validandoMX, setValidandoMX] = useState(false);

      // Estados para Verificación de 2 Pasos (6 dígitos separados)
      const [correoEnProceso, setCorreoEnProceso] = useState("");
      const [digitosOTP, setDigitosOTP] = useState(["", "", "", "", "", ""]);
      const [codigoDemoSandbox, setCodigoDemoSandbox] = useState(null);
      const [errorAuth, setErrorAuth] = useState(null);
      const inputsRef = useRef([]);

      // Estados de Subida de Evidencias e IA
      const [materiaSeleccionada, setMateriaSeleccionada] = useState("");
      const [titulo, setTitulo] = useState("");
      const [descripcion, setDescripcion] = useState("");
      const [urlExterna, setUrlExterna] = useState("");
      const [colaArchivos, setColaArchivos] = useState([]);
      const [subiendo, setSubiendo] = useState(false);
      const [alerta, setAlerta] = useState(null);

      // Estados de Portafolio / CV
      const [datosPortafolio, setDatosPortafolio] = useState(null);
      const [semestreActivoHistorial, setSemestreActivoHistorial] = useState("TODOS");
      const [archivoEnVisor, setArchivoEnVisor] = useState(null);
      const [textoCodigoVisor, setTextoCodigoVisor] = useState("");

      const cargarDatosUsuario = async (userObj = usuarioActivo) => {
        try {
          const idParam = userObj ? `?estudiante_id=${userObj.id}` : "";
          const rMat = await fetch(`${API_BASE}/api/reticula/materias${idParam}`);
          if (rMat.ok) {
            const dataMat = await rMat.json();
            if (Array.isArray(dataMat)) {
              setMaterias(dataMat);
              if (dataMat.length > 0 && !materiaSeleccionada) setMateriaSeleccionada(dataMat[0].id);
            }
          }
          if (userObj) {
            const rPort = await fetch(`${API_BASE}/api/portafolio/${userObj.id}`);
            if (rPort.ok) setDatosPortafolio(await rPort.json());
          }
        } catch (err) {
          console.error(err);
        }
      };

      useEffect(() => { cargarDatosUsuario(); }, [usuarioActivo]);

      // Verificar en vivo si el correo electrónico existe en servidores DNS MX
      const verificarCorreoEnTiempoReal = async (emailValor) => {
        if (!emailValor || !emailValor.includes("@")) {
          setEstadoCorreoMX(null);
          return;
        }
        setValidandoMX(true);
        const fd = new FormData();
        fd.append("correo", emailValor);
        try {
          const res = await fetch(`${API_BASE}/api/auth/validar-correo`, { method: "POST", body: fd });
          const data = await res.json();
          if (res.ok) {
            setEstadoCorreoMX({ valido: true, texto: data.mensaje });
          } else {
            setEstadoCorreoMX({ valido: false, texto: data.detail });
          }
        } catch {
          setEstadoCorreoMX(null);
        } finally {
          setValidandoMX(false);
        }
      };

      // Manejo de las 6 casillas del código de verificación
      const cambiarDigitoOTP = (index, valor) => {
        const soloNumero = valor.replace(/[^0-9]/g, "").slice(-1);
        const nuevos = [...digitosOTP];
        nuevos[index] = soloNumero;
        setDigitosOTP(nuevos);
        if (soloNumero && index < 5 && inputsRef.current[index + 1]) {
          inputsRef.current[index + 1].focus();
        }
      };

      const pegarCodigoCompleto = (e) => {
        const pegado = e.clipboardData.getData("text").replace(/[^0-9]/g, "").slice(0, 6);
        if (pegado.length > 0) {
          const nuevos = ["", "", "", "", "", ""];
          for (let i = 0; i < pegado.length; i++) nuevos[i] = pegado[i];
          setDigitosOTP(nuevos);
        }
      };

      // PASO 1 REGISTRO: Crear cuenta y disparar código de verificación al correo
      const manejarRegistro = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        if (estadoCorreoMX && !estadoCorreoMX.valido) {
          setErrorAuth({ tipo: "error", msg: estadoCorreoMX.texto });
          return;
        }

        const fd = new FormData();
        fd.append("nombre_completo", nombreReg);
        fd.append("matricula", matriculaReg);
        fd.append("correo", correoReg);
        fd.append("password", passwordReg);
        fd.append("es_itics", true);
        fd.append("modo_semestre", modoSemestreReg);
        fd.append("semestre_base", semestreManualReg);
        if (modoSemestreReg === "AUTOMATICO" && fechaInicioReg && fechaFinReg) {
          fd.append("fecha_inicio_semestre", fechaInicioReg);
          fd.append("fecha_fin_semestre", fechaFinReg);
        }
        if (fotoReg) fd.append("foto", fotoReg);

        const res = await fetch(`${API_BASE}/api/auth/registro`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok && data.requiere_verificacion) {
          setCorreoEnProceso(data.correo);
          setDigitosOTP(["", "", "", "", "", ""]);
          setCodigoDemoSandbox(data.codigo_respaldo || null);
          setErrorAuth({ tipo: "ok", msg: data.mensaje });
          setModoAuth("verificar_correo");
        } else {
          setErrorAuth({ tipo: "error", msg: data.detail || "No se pudo crear la cuenta." });
        }
      };

      // PASO 2 REGISTRO: Confirmar el código de 6 dígitos enviado al correo
      const manejarVerificarCorreo = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        const codigoUnido = digitosOTP.join("");
        if (codigoUnido.length !== 6) {
          setErrorAuth({ tipo: "error", msg: "Ingresa los 6 dígitos del código de verificación." });
          return;
        }

        const fd = new FormData();
        fd.append("correo", correoEnProceso);
        fd.append("codigo", codigoUnido);

        const res = await fetch(`${API_BASE}/api/auth/verificar-correo`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok && data.usuario) {
          localStorage.setItem("itp_usuario_sesion", JSON.stringify(data.usuario));
          setUsuarioActivo(data.usuario);
          setCodigoDemoSandbox(null);
          await cargarDatosUsuario(data.usuario);
          setVistaActual("portafolio");
        } else {
          setErrorAuth({ tipo: "error", msg: data.detail || "Código inválido." });
        }
      };

      const manejarReenviarCodigo = async (proposito = "VERIFICAR_CORREO") => {
        setErrorAuth(null);
        const fd = new FormData();
        fd.append("correo", correoEnProceso);
        fd.append("proposito", proposito);
        const res = await fetch(`${API_BASE}/api/auth/reenviar-codigo`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          setDigitosOTP(["", "", "", "", "", ""]);
          setCodigoDemoSandbox(data.codigo_respaldo || null);
          setErrorAuth({ tipo: "ok", msg: data.mensaje });
        } else {
          setErrorAuth({ tipo: "error", msg: data.detail });
        }
      };

      // LOGIN
      const manejarLogin = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        const fd = new FormData();
        fd.append("identificador", matriculaReg);
        fd.append("password", passwordReg);

        const res = await fetch(`${API_BASE}/api/auth/login`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          if (data.requiere_verificacion) {
            setCorreoEnProceso(data.correo);
            setDigitosOTP(["", "", "", "", "", ""]);
            setCodigoDemoSandbox(data.codigo_respaldo || null);
            setErrorAuth({ tipo: "info", msg: data.mensaje });
            setModoAuth("verificar_correo");
          } else if (data.usuario) {
            localStorage.setItem("itp_usuario_sesion", JSON.stringify(data.usuario));
            setUsuarioActivo(data.usuario);
            await cargarDatosUsuario(data.usuario);
            setVistaActual("portafolio");
          }
        } else {
          setErrorAuth({ tipo: "error", msg: data.detail || "Credenciales incorrectas." });
        }
      };

      // RECUPERAR CONTRASEÑA PASO 1: Poner el correo con el que se registró
      const manejarSolicitarRecuperacion = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        const fd = new FormData();
        fd.append("correo", correoReg);

        const res = await fetch(`${API_BASE}/api/auth/recuperar-solicitar`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          setCorreoEnProceso(data.correo);
          setDigitosOTP(["", "", "", "", "", ""]);
          setPasswordReg("");
          setConfirmarPasswordReg("");
          setCodigoDemoSandbox(data.codigo_respaldo || null);
          setErrorAuth({ tipo: "ok", msg: data.mensaje });
          setModoAuth("recuperar_nueva_clave");
        } else {
          setErrorAuth({ tipo: "error", msg: data.detail || "No encontramos ese correo." });
        }
      };

      // RECUPERAR CONTRASEÑA PASO 2: Código de 6 dígitos + Nueva Contraseña
      const manejarConfirmarNuevaPassword = async (e) => {
        e.preventDefault();
        setErrorAuth(null);
        const codigoUnido = digitosOTP.join("");
        if (codigoUnido.length !== 6) {
          setErrorAuth({ tipo: "error", msg: "Ingresa los 6 dígitos del código de verificación." });
          return;
        }

        const fd = new FormData();
        fd.append("correo", correoEnProceso);
        fd.append("codigo", codigoUnido);
        fd.append("nueva_password", passwordReg);
        fd.append("confirmar_password", confirmarPasswordReg);

        const res = await fetch(`${API_BASE}/api/auth/recuperar-confirmar`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          setCodigoDemoSandbox(null);
          setMatriculaReg(correoEnProceso);
          setPasswordReg("");
          setErrorAuth({ tipo: "ok", msg: data.mensaje });
          setModoAuth("login");
        } else {
          setErrorAuth({ tipo: "error", msg: data.detail || "No se pudo cambiar la contraseña." });
        }
      };

      const cerrarSesion = () => {
        localStorage.removeItem("itp_usuario_sesion");
        setUsuarioActivo(null);
        setDatosPortafolio(null);
        setVistaActual("inicio");
      };

      const guardarEvidenciaConIA = async (e) => {
        e.preventDefault();
        if (!usuarioActivo) return;
        setSubiendo(true);
        setAlerta(null);
        const fd = new FormData();
        fd.append("estudiante_id", usuarioActivo.id);
        fd.append("titulo", titulo);
        fd.append("descripcion", descripcion);
        fd.append("materia_id", materiaSeleccionada);
        if (urlExterna.trim()) fd.append("url_enlace_externo", urlExterna.trim());
        colaArchivos.forEach((f) => fd.append("archivos", f));

        const res = await fetch(`${API_BASE}/api/evidencias/subir`, { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          setAlerta({ tipo: "ok", msg: data.mensaje, detalleIA: data.analisis_ia });
          setTitulo(""); setDescripcion(""); setUrlExterna(""); setColaArchivos([]);
          await cargarDatosUsuario();
        } else {
          setAlerta({ tipo: "error", msg: data.detail || "Error al subir." });
        }
        setSubiendo(false);
      };

      const previsualizarArchivo = async (arch) => {
        setArchivoEnVisor(arch);
        setTextoCodigoVisor("");
        const n = (arch.nombre || "").toLowerCase();
        if (arch.tipo === "CODIGO" || n.endsWith(".txt") || n.endsWith(".md") || n.endsWith(".sql") || n.endsWith(".py") || n.endsWith(".kt")) {
          const res = await fetch(`${API_BASE}/api/archivos/leer-texto/${arch.id}`);
          if (res.ok) setTextoCodigoVisor(await res.text());
        }
      };

      const construirHistorialPorSemestre = () => {
        const mapaEvidenciasPorMateria = {};
        if (datosPortafolio && Array.isArray(datosPortafolio.portafolio_por_materia)) {
          datosPortafolio.portafolio_por_materia.forEach((bloque) => {
            if (bloque && bloque.clave) mapaEvidenciasPorMateria[bloque.clave] = bloque.evidencias || [];
          });
        }
        return [1, 2, 3, 4, 5, 6, 7, 8, 9].map((numSem) => {
          const materiasDelSemestre = (materias || []).filter((m) => m.semestre === numSem);
          const materiasConHistorial = materiasDelSemestre.map((m) => ({
            ...m, evidencias: mapaEvidenciasPorMateria[m.clave] || [],
          }));
          const totalEvidenciasSemestre = materiasConHistorial.reduce((acc, m) => acc + (m.evidencias?.length || 0), 0);
          return { semestre: numSem, materias: materiasConHistorial, totalEvidenciasSemestre };
        }).filter((s) => semestreActivoHistorial === "TODOS" || s.semestre === Number(semestreActivoHistorial));
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">
          {/* BARRA SUPERIOR */}
          <nav className="border-b border-slate-800 bg-slate-900 sticky top-0 z-40 print:hidden">
            <div className="max-w-7xl mx-auto px-6 py-4 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setVistaActual("inicio")}>
                <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-lg">ITP</div>
                <div>
                  <span className="font-bold text-white block leading-none">Portafolio Académico ITP</span>
                  <span className="text-xs text-blue-400">Ingeniería en TICs • Seguridad 2FA Verificada</span>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button onClick={() => setVistaActual("inicio")} className={`px-3.5 py-2 text-xs font-bold rounded-lg ${vistaActual === "inicio" ? "bg-blue-600 text-white" : "bg-slate-800 hover:bg-slate-700"}`}>Inicio</button>
                <button onClick={() => setVistaActual("reticula")} className={`px-3.5 py-2 text-xs font-bold rounded-lg ${vistaActual === "reticula" ? "bg-blue-600 text-white" : "bg-slate-800 hover:bg-slate-700"}`}>Retícula</button>
                {usuarioActivo ? (
                  <>
                    <button onClick={() => setVistaActual("subir")} className={`px-3.5 py-2 text-xs font-bold rounded-lg ${vistaActual === "subir" ? "bg-blue-600 text-white" : "bg-slate-800 hover:bg-slate-700"}`}>+ Subir Evidencia</button>
                    <button onClick={() => { cargarDatosUsuario(); setVistaActual("portafolio"); }} className={`px-3.5 py-2 text-xs font-bold rounded-lg ${vistaActual === "portafolio" ? "bg-emerald-600 text-white" : "bg-emerald-700 hover:bg-emerald-600 text-white"}`}>Mi CV</button>
                    <button onClick={cerrarSesion} className="px-3 py-2 text-xs font-bold rounded-lg bg-red-950/70 text-red-300 border border-red-800">Salir</button>
                  </>
                ) : (
                  <>
                    <button onClick={() => { setModoAuth("login"); setErrorAuth(null); setVistaActual("auth"); }} className="px-4 py-2 text-xs font-bold rounded-lg bg-slate-800 hover:bg-slate-700">Iniciar Sesión</button>
                    <button onClick={() => { setModoAuth("registro"); setErrorAuth(null); setVistaActual("auth"); }} className="px-4 py-2 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-500">Crear Cuenta</button>
                  </>
                )}
              </div>
            </div>
          </nav>

          {/* 1. LANDING PAGE */}
          {vistaActual === "inicio" && (
            <main className="max-w-6xl mx-auto px-6 py-16 text-center">
              <span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-950 text-blue-300 border border-blue-800">
                Instituto Tecnológico de Puebla • Verificación en 2 Pasos + IA
              </span>
              <h1 className="text-4xl md:text-6xl font-extrabold mt-6 text-white leading-tight">
                Plataforma de Portafolio Académico <span className="text-blue-400">ITICs</span>
              </h1>
              <p className="mt-6 text-lg text-slate-300 max-w-3xl mx-auto">
                Crea tu cuenta estudiantil verificando tu correo electrónico real, sube tus evidencias por semestre y genera automáticamente tu Currículum Técnico analizado por Inteligencia Artificial.
              </p>
              <div className="mt-10 flex justify-center gap-4">
                {!usuarioActivo ? (
                  <>
                    <button onClick={() => { setModoAuth("registro"); setErrorAuth(null); setVistaActual("auth"); }} className="px-8 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 font-extrabold text-white shadow-lg">Crear Cuenta</button>
                    <button onClick={() => { setModoAuth("login"); setErrorAuth(null); setVistaActual("auth"); }} className="px-8 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-slate-200 border border-slate-700">Iniciar Sesión</button>
                  </>
                ) : (
                  <button onClick={() => setVistaActual("portafolio")} className="px-8 py-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-extrabold text-white">Ir a Mi Portafolio →</button>
                )}
              </div>
            </main>
          )}

          {/* 2. MÓDULO DE SEGURIDAD: CREAR CUENTA / VERIFICAR CORREO (2FA) / LOGIN / RECUPERAR CONTRASEÑA */}
          {vistaActual === "auth" && (
            <section className="max-w-xl mx-auto px-6 py-10">
              <div className="p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl">
                
                {(modoAuth === "registro" || modoAuth === "login") && (
                  <div className="flex gap-2 mb-6 p-1 bg-slate-950 rounded-xl border border-slate-800">
                    <button onClick={() => { setModoAuth("registro"); setErrorAuth(null); }} className={`flex-1 py-2.5 rounded-lg text-xs font-extrabold transition ${modoAuth === "registro" ? "bg-blue-600 text-white" : "text-slate-400"}`}>Crear Cuenta</button>
                    <button onClick={() => { setModoAuth("login"); setErrorAuth(null); }} className={`flex-1 py-2.5 rounded-lg text-xs font-extrabold transition ${modoAuth === "login" ? "bg-blue-600 text-white" : "text-slate-400"}`}>Iniciar Sesión</button>
                  </div>
                )}

                {errorAuth && (
                  <div className={`mb-5 p-4 rounded-xl border text-xs font-semibold ${
                    errorAuth.tipo === "ok" ? "bg-emerald-950/70 border-emerald-500 text-emerald-200" :
                    errorAuth.tipo === "info" ? "bg-blue-950/70 border-blue-500 text-blue-200" :
                    "bg-red-950/70 border-red-500 text-red-200"
                  }`}>
                    {errorAuth.msg}
                  </div>
                )}

                {/* PANTALLA A: CREAR CUENTA CON VALIDACIÓN DNS MX EN TIEMPO REAL */}
                {modoAuth === "registro" && (
                  <form onSubmit={manejarRegistro} className="space-y-4">
                    <div>
                      <h2 className="text-2xl font-extrabold text-white">Crear Cuenta</h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Validaremos que tu correo personal exista realmente y te enviaremos un código de 6 dígitos para verificar tu identidad.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-blue-400 mb-1">Nombre Completo *</label>
                        <input required type="text" value={nombreReg} onChange={e => setNombreReg(e.target.value)} placeholder="Nombre y Apellidos" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-blue-400 mb-1">Número de Control *</label>
                        <input required type="text" value={matriculaReg} onChange={e => setMatriculaReg(e.target.value)} placeholder="Ej. 23221036" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white font-mono" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-emerald-400 mb-1">Correo Personal (Se verificará que exista) *</label>
                      <input
                        required
                        type="email"
                        value={correoReg}
                        onChange={e => { setCorreoReg(e.target.value); setEstadoCorreoMX(null); }}
                        onBlur={e => verificarCorreoEnTiempoReal(e.target.value)}
                        placeholder="tu_correo_real@gmail.com"
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white font-mono"
                      />
                      {validandoMX && <p className="text-[11px] text-blue-400 mt-1">Comprobando servidores de correo DNS (MX)...</p>}
                      {estadoCorreoMX && (
                        <p className={`text-[11px] mt-1 font-semibold ${estadoCorreoMX.valido ? "text-emerald-400" : "text-red-400"}`}>
                          {estadoCorreoMX.valido ? "✓ " : "✕ "}{estadoCorreoMX.texto}
                        </p>
                      )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-blue-400 mb-1">Contraseña (Mín. 6 caracteres) *</label>

          {archivoEnVisor && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-5xl w-full p-6"><div className="flex justify-between items-center mb-4"><h4 className="font-bold text-white">{archivoEnVisor.nombre}</h4><button onClick={() => setArchivoEnVisor(null)} className="px-3 py-1 rounded bg-red-600 text-white text-xs font-bold">Cerrar ✕</button></div>
                {archivoEnVisor.tipo === "IMAGEN" ? <img src={`${API_BASE}${archivoEnVisor.url}`} className="max-h-[70vh] mx-auto rounded" /> : archivoEnVisor.tipo === "VIDEO" || archivoEnVisor.nombre?.toLowerCase().endsWith(".mp4") ? <video controls autoPlay className="max-h-[70vh] w-full rounded"><source src={`${API_BASE}${archivoEnVisor.url}`} /></video> : textoCodigoVisor ? <pre className="bg-slate-950 text-emerald-300 p-4 rounded-xl text-xs font-mono overflow-auto max-h-[70vh]">{textoCodigoVisor}</pre> : <iframe src={`${API_BASE}${archivoEnVisor.url}`} className="w-full h-[70vh] rounded-xl bg-white" />}
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PortafolioITPApp />);
  </script>
</body>
</html>
